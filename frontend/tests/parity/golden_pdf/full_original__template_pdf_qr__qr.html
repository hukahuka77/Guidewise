<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Cozy Cabin &lt;Deluxe&gt; — QR Poster</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    @page { size: letter; margin: 0.5in; }
    body {
      /* Classier serif stack for print */
      font-family: Georgia, 'Times New Roman', Times, serif;
      color: #1f2937;
      background: #ffffff;
    }
    .page-frame {
      /* letter (11in) minus the 0.5in @page margins, with a little slack so browsers do not spill a 2nd page */
      height: 9.95in;
      box-sizing: border-box;
      border: 2pt solid #e5e7eb; /* subtle light gray border */
      border-radius: 10pt;
      padding: 0.4in;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 100%;
      text-align: center;
    }
    .title {
      font-size: 30pt;
      font-weight: 700;
      letter-spacing: 0.3px;
      margin: 0.2in 0 0.05in 0;
      color: #111827;
    }
    .subtitle {
      font-size: 12pt;
      color: #6b7280;
      margin-bottom: 0.25in;
    }
    .qr-wrap {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0.1in 0 0.2in 0;
    }
    /* The QR should take roughly 2/3 of the page height. With margins and text, target ~6.5in square. */
    .qr {
      width: 6.5in;
      height: 6.5in;
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      border: 12px solid #ffffff;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      border-radius: 16px;
      background: #ffffff;
    }
    .footer {
      margin-top: auto;
      font-size: 10pt;
      color: #9ca3af;
    }
    .brand {
      text-transform: uppercase;
      letter-spacing: 1.2px;
      font-weight: 800;
      color: #111827;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="page-frame">
      
        <h1 class="title">Cozy Cabin &lt;Deluxe&gt; Digital Guidebook</h1>
      
    
      <div class="subtitle">Hosted by Andrew</div>
    

    <div class="qr-wrap">
      
        <img class="qr" src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&amp;data=https%3A%2F%2Fwww.example.com%2Fg%2Fmy-place%3Fx%3D1%26y%3D%282%29" alt="QR code to open the guidebook" />
      
    </div>

    <div class="footer">Scan to view the live guidebook • <span class="brand">Guidewise</span></div>
    </div>
  </div>
</body>
</html>
